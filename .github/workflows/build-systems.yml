name: build-systems
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-hornicorn:
    name: hornicorn (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      # Free ~30 GB of disk space by evicting pre-installed GH Actions tools.
      # Required: the omniroute Next.js build + full NixOS closure is large.
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/checkout@v4
      # Push build outputs to Cachix so the local machine can pull closures
      # instead of rebuilding. Set CACHIX_AUTH_TOKEN in repo Settings →
      # Secrets and variables → Actions. Cache name must match your Cachix
      # cache (create one at cachix.org if you haven't yet).
      - uses: cachix/cachix-action@v15
        with:
          name: lul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Inject CI=true so modules that gate impure/hardware behaviour on it
      # (e.g. skipping physical device assertions) can detect the CI context.
      # import-tree picks this up automatically alongside the rest of modules/.
      - name: inject ci-runtime.nix
        run: |
          cat > modules/ci-runtime.nix <<'EOF'
          { _module.args.CI = true; }
          EOF
      - name: build hornicorn
        run: |
          set -euo pipefail
          build_out=$(nix build \
            .#nixosConfigurations.hornicorn.config.system.build.toplevel \
            --no-link \
            --print-out-paths \
            --show-trace)
          echo "BUILD_OUT=${build_out}" >> "$GITHUB_ENV"
      - name: summary
        run: echo "<code>${{ env.BUILD_OUT }}</code>" >> "$GITHUB_STEP_SUMMARY"
      - name: collect nix logs
        if: failure()
        run: |
          mkdir -p artifacts
          cp -v /tmp/nix*log artifacts/ 2>/dev/null || true
          journalctl -u nix-daemon --no-pager -n 200 > artifacts/nix-daemon.log 2>/dev/null || true
          tar -czf artifacts.tar.gz artifacts || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nix-logs
          path: artifacts.tar.gz
